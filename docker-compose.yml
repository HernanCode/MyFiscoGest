services:
  app:
    build: .
    image: myfiscogest:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      # Si hay un proxy delante (nginx/traefik/caddy), descomenta:
      # TRUSTED_PROXIES: "*"
    ports:
      - "8080:80"
    volumes:
      - storage:/var/www/html/storage

volumes:
  storage:
