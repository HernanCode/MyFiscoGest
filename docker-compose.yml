services:
  app:
    build: .
    image: myfiscogest:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: myfiscogest
      DB_USERNAME: myfiscogest
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      TRUSTED_PROXIES: "*"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: myfiscogest
      MYSQL_USER: myfiscogest
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  storage:
  dbdata: